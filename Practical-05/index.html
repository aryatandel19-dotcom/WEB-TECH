<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Registration Form</h1>
    <p class="subtitle">
        Please enter your details carefully
    </p>
    <form id="registrationForm" novalidate>
        <!-- Full Name -->
        <div class="form-group">
            <label for="name">
                Full Name <span>*</span>
            </label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                aria-required="true"
                aria-describedby="nameError"
            >
            <small id="nameError" class="error"></small>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">
                Email Address <span>*</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                autocomplete="email"
                aria-required="true"
                aria-describedby="emailError"
            >
            <small id="emailError" class="error"></small>
        </div>

        <!-- Mobile -->
        <div class="form-group">
            <label for="mobile">
                Mobile Number <span>*</span>
            </label>
            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                aria-required="true"
                aria-describedby="mobileError"
            >
            <small id="mobileError" class="error"></small>
        </div>

        <!-- Address -->
        <div class="form-group">
            <label for="address">
                Address <span>*</span>
            </label>
            <textarea
                id="address"
                name="address"
                rows="3"
                placeholder="Enter your full address"
                aria-required="true"
                aria-describedby="addressError"></textarea>
            <small id="addressError" class="error"></small>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">
                Password <span>*</span>
            </label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="new-password"
                aria-required="true"
                aria-describedby="passwordError strengthText"
            >
            <div class="strength-container">
                <div id="strengthBar"></div>
            </div>
            <small id="strengthText"></small>
            <small id="passwordError" class="error"></small>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirmPassword">
                Confirm Password <span>*</span>
            </label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter password"
                autocomplete="new-password"
                aria-required="true"
                aria-describedby="confirmPasswordError"
            >
            <small id="confirmPasswordError" class="error"></small>
        </div>

        <!-- Course -->
        <div class="form-group">
            <label for="course">
                Course <span>*</span>
            </label>
            <select
                id="course"
                name="course"
                aria-required="true"
                aria-describedby="courseError">
                <option value="">-- Select Course --</option>
                <option value="AIML">B.Tech AIML</option>
                <option value="CSE">B.Tech CSE</option>
                <option value="IT">B.Tech IT</option>
                <option value="CE">B.Tech CE</option>
            </select>
            <small id="courseError" class="error"></small>
        </div>

        <!-- Academic Year -->
        <div class="form-group">
            <label for="year">
                Academic Year <span>*</span>
            </label>
            <select
                id="year"
                name="year"
                aria-required="true"
                aria-describedby="yearError">
                <option value="">-- Select Year --</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <small id="yearError" class="error"></small>
        </div>

        <!-- Gender -->
        <fieldset class="form-group gender-fieldset">
            <legend>
                Gender <span>*</span>
            </legend>
            <div class="radio-group">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>
                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>
            <small id="genderError" class="error"></small>
        </fieldset>

        <!-- Terms -->
        <div class="terms">
            <label for="terms">
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    aria-required="true"
                    aria-describedby="termsError"
                >
                I accept the Terms and Conditions
                <span>*</span>
            </label>
            <small id="termsError" class="error"></small>
        </div>

        <!-- Register -->
        <button type="submit">Register</button>

        <!-- Reset -->
        <button type="reset" id="resetButton">Reset</button>

        <!-- Success Message -->
        <p id="successMessage" role="status" aria-live="polite"></p>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
